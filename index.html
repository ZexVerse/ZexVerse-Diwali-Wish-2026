
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZexVerse | Diwali 2026</title>

  <meta name="description" content="Celebrate Diwali 2026 with ZexVerse! Create and share your personalised Diwali wishes.">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <img src="images/diwalilogo.png" alt="ZexVerse Logo">
        <h1>ZexVerse</h1>
    </header>

    <main>

        <h2>Happy Diwali 2026!</h2>

        <p>Celebrate the festival of lights with ZexVerse.</p>

        <div class="wish-form">

            <h3>Who are we celebrating with?</h3>

            <div class="input-row">
    <input
        type="text"
        id="visitorName"
        placeholder="Enter your name"
        maxlength="30"
        autocomplete="name"
    >

    <span id="charCount">0/30</span>
            </div>

            <button id="wishButton" type="button">
                Create My Wish
            </button>

            <p id="greeting"></p>

        </div>

        <div class="wish-card" id="wishCard">

            <img src="images/diwalilogo.png" alt="ZexVerse Logo">

            <h2>Happy Diwali!</h2>

            <p id="cardMessage"></p>

            <h3>✨ From Team ZexVerse ✨</h3>

          <button id="shareButton" type="button">
    Copy My Wish
          </button>

        </div>

        <div class="decorations">

            <div class="top-decorations">

                <img
                    src="images/lantern.png"
                    class="lantern"
                    alt="Lantern"
                >

                <img
                    src="images/rangoli.png"
                    class="rangoli"
                    alt="Rangoli"
                >

                <img
                    src="images/lantern.png"
                    class="lantern"
                    alt="Lantern"
                >

            </div>

            <img
                src="images/diya.png"
                class="diya"
                alt="Diya"
            >

        </div>

    </main>

  <footer>
    <p>© 2026 ZexVerse. Made with ❤️ for Diwali.</p>
    <p>✨ Spreading happiness, one wish at a time. ✨</p>
  </footer>

    <script src="./script.js"></script>

</body>

</html>
